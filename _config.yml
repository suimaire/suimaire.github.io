title: "HAFS 생명과학 실험실"
description: "질문하고, 관찰하고, 데이터로 설명하는 과학 수업 공간"
url: "https://suimaire.github.io"

remote_theme: pmarsceill/just-the-docs

# Jekyll 3.x 는 exclude 를 지정하면 기본 목록을 대체하므로 기본값을 함께 적습니다.
# tests/ : assets/js/page-views.js 단위 테스트(node --test tests/page-views.test.mjs). 사이트에 배포하지 않습니다.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - tests/

just_the_docs:
  heading_numbers: false
  heading_number_levels: 6

# 메인 포털(/)의 사이드바에서 숨길 navigation branch (제목 기준).
# 홈에서는 아래 강좌가 COURSE LIBRARY 카드로 이미 안내되므로 사이드바에서는 접어 둡니다.
# /bioinformatics/ 등 강좌 내부 페이지에서는 그대로 표시됩니다.
# 처리: _includes/components/sidebar.html + _includes/components/site_nav.html
home_nav_hidden_branches:
  - 생물정보학 기초

# 사이드바에 표시할 수업 영역 (메인 COURSE LIBRARY 의 각 영역으로 이동)
# 세부 자료는 사이드바가 아니라 메인 COURSE LIBRARY 에서 찾습니다.
nav_external_links:
  - title: 생태계·개체군 모델링
    url: /#ecosystem
    hide_icon: true
    opens_in_new_tab: false
  - title: 분자·생화학 3D 탐구
    url: /#molecular
    hide_icon: true
    opens_in_new_tab: false
  - title: 생물정보학·데이터
    url: /#bioinformatics
    hide_icon: true
    opens_in_new_tab: false
