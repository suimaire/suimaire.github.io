# 포털 B "분자·생화학 탐구" 영역의 자료 목록
#
# 새 탐색기(예: 핵산 3D 탐색기)를 추가하려면 이 파일 맨 아래에 항목
# 하나만 덧붙이면 됩니다. index.md 는 고치지 않아도 됩니다.
# 자료 번호(B1, B2 ...)는 여기 적힌 순서대로 화면에서 자동으로 매겨집니다.
# 사전 학습도 번호를 하나 차지합니다. 수업에서 이미 부른 번호가 바뀌지 않도록
# 중간에 끼워 넣지 말고 맨 아래에 추가하세요.
#
#   - label:       제목 위 작은 분류 표시 (짧게, 한국어로. "01 ·" 같은 번호는 붙이지 않음)
#   - title:       자료 제목 (목록의 링크가 됩니다)
#   - description: 설명 한 문단 (두세 줄 이내가 보기 좋습니다)
#   - meta:        설명 아래 한 줄로 이어 붙일 부가 정보 (생략 가능)
#   - url:         이동할 주소 (별도 GitHub Pages 앱이면 절대 주소)
#   - cta:         링크 문구
#   - status:      상태. "운영 중"은 화면에 표시하지 않고, 그 밖의 값(예: "준비 중")만
#                  분류 표시 옆에 작게 보입니다.
#   - prelearning: 사전학습 도구 (생략 가능). 해당 탐색기 바로 앞 칸에 번호를 하나
#                  받아 "사전 학습 · B4 전에 해 보세요"처럼 표시됩니다.

