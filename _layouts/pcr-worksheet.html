<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/pcr-worksheet.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site-footer.css' | relative_url }}">
  <script type="module" src="{{ '/assets/js/pcr-worksheet.mjs' | relative_url }}"></script>
</head>
<body class="pcr-sheet">
  <a class="pcr-skip" href="#pcr-main">학습지 본문으로</a>
  <div id="pcr-worksheet" data-fixture-url="{{ '/assets/data/pcr-primer-fixture.json' | relative_url }}">{{ content }}</div>
  <footer class="pcr-site-footer" aria-label="사이트 정보">
    {% include footer_custom.html %}
  </footer>
</body>
</html>
